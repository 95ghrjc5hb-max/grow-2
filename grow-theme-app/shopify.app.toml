# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "c709f2e5a7caf3ee3c43d66deaedaebf"
name = "grow-thame-app"
application_url = "https://unloving-unnamed-flight.ngrok-free.dev"
embedded = false

[build]
automatically_update_urls_on_dev = true

[webhooks]
api_version = "2026-07"

[access.admin]
direct_api_mode = "offline"
embedded_app_direct_api_access = false

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
scopes = "read_orders,read_products,write_orders,write_products"

[auth]
redirect_urls = [
  "https://unloving-unnamed-flight.ngrok-free.dev/api/shopify/auth",
  "https://unloving-unnamed-flight.ngrok-free.dev/api/shopify/callback",
  "https://unloving-unnamed-flight.ngrok-free.dev/api/shopify/billing/callback",
  "https://unloving-unnamed-flight.ngrok-free.dev/api/v1/shopify/auth",
  "https://unloving-unnamed-flight.ngrok-free.dev/api/v1/shopify/callback",
  "https://unloving-unnamed-flight.ngrok-free.dev/api/v1/shopify/billing/callback"
]
[metaobjects.app.faq]
name = "FAQ"

[metaobjects.app.faq.fields.question]
name = "Question"
type = "single_line_text_field"
required = true

[metaobjects.app.faq.fields.answer]
name = "Answer"
type = "multi_line_text_field"
required = true

[metaobjects.app.faq.fields.show_on_faq_page]
name = "Show on FAQ page"
type = "boolean"

[product.metafields.app.faq]
name = "FAQ"
description = "FAQ for this product"
type = "metaobject_reference<$app:faq>"

  [product.metafields.app.faq.access]
  admin = "merchant_read_write"

[sidekick]
extensions_summary = "Read FAQ entries stored in the app"
